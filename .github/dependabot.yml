# Dependency update PRs. Deliberately low-noise: monthly, grouped, and with the
# two dependency families that are NOT ours to bump left alone (see below).
version: 2

updates:
  # ---------------------------------------------------------------------------
  # NuGet. There is no .sln, so both project files are listed explicitly.
  # ---------------------------------------------------------------------------
  - package-ecosystem: nuget
    directories:
      - "/"                              # CustomCoverArt.csproj
      - "/tests/CustomCoverArt.Tests"    # test-only packages
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    labels:
      - dependencies
    groups:
      # One PR a month for the safe bumps. Majors are deliberately excluded so
      # they arrive as their own PR and get read properly -- ImageSharp 4.x in
      # particular is a breaking change, and ImageSharp.Drawing is versioned
      # separately but must stay on the matching ImageSharp line.
      nuget-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # The Jellyfin.* packages pin the plugin to a server major -- moving them
      # is a deliberate cutover (that was the whole of v4.0.0.0), not a version
      # bump. They also read their version from the $(JellyfinVersion) MSBuild
      # property rather than a literal, which Dependabot cannot rewrite.
      - dependency-name: "Jellyfin.*"
      # ImageSharp 4.x and ImageSharp.Drawing 3.x enforce a Six Labors licence
      # key at BUILD time -- the build dies inside the package's own targets with
      # "No Six Labors license found" before any of our code compiles. Adopting
      # them is a licensing decision, not a version bump: a free Community tier
      # exists (licensing.sixlabors.com) but it puts a build-time credential in
      # the chain and every fork would need its own key. See PR #42 for the detail.
      #
      # The same enforcement was then backported to the old lines: ImageSharp
      # 3.2.0 and ImageSharp.Drawing 2.2.0 also fail the build without a key
      # (Dependabot PRs #58/#59, 2026-11). So everything from those versions up
      # is ignored; 3.1.x / 2.1.x patch releases still come through.
      - dependency-name: "SixLabors.ImageSharp"
        versions: [">= 3.2.0"]
      - dependency-name: "SixLabors.ImageSharp.Drawing"
        versions: [">= 2.2.0"]

  # ---------------------------------------------------------------------------
  # Workflow actions (actions/checkout, actions/setup-dotnet).
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
